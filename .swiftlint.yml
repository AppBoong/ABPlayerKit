# SwiftLint configuration for ABPlayerKit.
#
# Mechanically enforces the conventions listed in CONTRIBUTING.md. Rules
# under `disabled_rules` are violated broadly by code that predates this
# config; each carries a one-line count and reason so a future cleanup
# knows what to re-enable and where to look. New code should still aim to
# comply with disabled rules even though CI will not flag it.

included:
  - Sources
  - Tests
  - Examples

excluded:
  - "**/.build"
  - "**/DerivedData"

disabled_rules:
  # 268 hits across 62 files at the default 120-column limit, concentrated
  # in @Suite/@Test description strings and long call chains.
  - line_length
  # 33 hits from short loop/tuple-destructure identifiers (i, x, y, ...)
  # and a few long descriptive names in test scenarios.
  - identifier_name
  # 12 files exceed the default line-count ceiling (engine/store/controls
  # view types).
  - file_length
  # 16 hits in state-machine/policy functions with wide switch coverage.
  - cyclomatic_complexity
  # 8 hits in the same large types flagged by file_length.
  - type_body_length
  # 13 hits, mostly test setup/scenario functions with many steps.
  - function_body_length
  # 3 hits from call sites passing two trailing closures.
  - multiple_closures_with_trailing_closure
  # 3 hits from tuples wider than the default arity.
  - large_tuple

# The default 40-character ceiling is below what this repo's descriptive
# test-suite names need: the three hits are all names LONGER than the
# maximum (e.g. ABControlsPlayPauseReentrancyCharacterizationTests, 50),
# and each one states precisely what the suite pins, so raising the
# ceiling beats renaming. The rule stays on for its other checks — naming
# convention and minimum length.
type_name:
  max_length:
    warning: 50
    error: 60

custom_rules:
  no_main_actor_assume_isolated:
    name: "No MainActor.assumeIsolated"
    regex: 'MainActor\.assumeIsolated'
    match_kinds: identifier
    message: >-
      CONTRIBUTING.md prohibits MainActor.assumeIsolated; keep call sites
      provably non-isolation-assuming (await the actor instead).
    severity: error
