name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      DESTINATION: platform=iOS Simulator,name=iPhone 16 Pro
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build and test package with warnings as errors
        run: >-
          xcodebuild
          -scheme ABPlayerKit-Package
          -destination "$DESTINATION"
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          GCC_TREAT_WARNINGS_AS_ERRORS=YES
          EXTRACT_APP_INTENTS_METADATA=NO
          build test

      - name: Build demo with warnings as errors
        run: >-
          xcodebuild
          -project Examples/ABPlayerKitDemo/ABPlayerKitDemo.xcodeproj
          -scheme ABPlayerKitDemo
          -destination "$DESTINATION"
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          GCC_TREAT_WARNINGS_AS_ERRORS=YES
          EXTRACT_APP_INTENTS_METADATA=NO
          build
