name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Forwarded into the test runner with the TEST_RUNNER_ prefix stripped, and
# read by `abScaledTimeout`/`waitUntil` in Tests/ABTestSupport. A handful of
# tests race real work against a wall-clock deadline; on a shared 3-core
# runner that work is slower, not stuck, and an unscaled deadline reports the
# slowdown as a deadlock.
#
# Declared once at workflow level on purpose. It used to be set only on the
# ThreadSanitizer job, on the theory that sanitizer instrumentation was the
# thing that needed absorbing. Runner contention alone is enough: in run
# 31854690881 the whole cache suite ran at 17.0s against 4.2s on the same
# code a few hours earlier, with individual tests at 15.9s that normally
# finish in well under a second, and the one test whose deadline was still
# 2s failed.
#
# Six was set from that one observation and turned out to be far short of the
# real spread. Measuring the ThreadSanitizer job's 281-test core suite against
# the same commit run locally under the same sanitizer:
#
#     local                      1.1s
#     CI, passing (451c425)     32.3s     29x
#     CI, passing (adf6e3b)     54.8s     50x
#     CI, passing (d2d3e61)     65.3s     59x
#     CI, failing               55.4s     52x
#     CI, failing              216.6s    203x
#
# A *passing* run at 54.8s and a failing one at 55.4s are the same run, so at
# six the deadlines sat inside the noise and which tests failed was a coin
# toss — a different one each time, always a `waitUntil` timeout, never a
# data race. Twenty-four covers the passing spread with headroom and most of
# the excursion; it raises a threshold rather than fixing the shape, and the
# real answer stays signal-based waiting instead of racing a duration.
#
# The scale sizes deadlines measured in seconds, so it must not be applied
# unbounded to the per-suite `.timeLimit`, whose base is already minutes:
# `abScaledMinutes` caps its result at 15 minutes so the limit always fires
# before this job's own `timeout-minutes` and keeps working as a hang
# detector. Raising the scale further does not change that ceiling.
env:
  TEST_RUNNER_ABPLAYERKIT_WAIT_SCALE: "24"

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      coverage-percent: ${{ steps.coverage.outputs.percent }}
    env:
      PINNED_DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PREFERRED_SIMULATOR_NAME: iPhone 16 Pro
    steps:
      - uses: actions/checkout@v4

      - name: Resolve toolchain
        run: |
          if test -d "$PINNED_DEVELOPER_DIR"; then
            resolved_developer_dir="$PINNED_DEVELOPER_DIR"
          else
            resolved_developer_dir="$(xcode-select -p)"
          fi
          echo "DEVELOPER_DIR=$resolved_developer_dir" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Prepare iOS simulator
        run: bash .github/scripts/prepare-simulator.sh

      - name: Build and test package with warnings as errors
        run: >-
          xcodebuild
          -scheme ABPlayerKit-Package
          -destination "$DESTINATION"
          -enableCodeCoverage YES
          -resultBundlePath "$RUNNER_TEMP/ABPlayerKit.xcresult"
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          GCC_TREAT_WARNINGS_AS_ERRORS=YES
          EXTRACT_APP_INTENTS_METADATA=NO
          build test

      # `continue-on-error` because this bundle is evidence for investigating a
      # failure, not a gate. Without it a transient upload error takes the job
      # down after every test has already passed, and — because the steps below
      # are ordered after it — skips the documentation and demo builds, which
      # are real gates. That happened: `Failed to CreateArtifact: Unable to
      # make request: ENOTFOUND` on a green 761-test run.
      #
      # The step still reports as failed, so a persistent upload problem stays
      # visible instead of being swallowed.
      - name: Upload test result bundle
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ABPlayerKit.xcresult
          path: ${{ runner.temp }}/ABPlayerKit.xcresult
          retention-days: 14

      - name: Summarize coverage
        id: coverage
        run: |
          set -euo pipefail
          xcresult="$RUNNER_TEMP/ABPlayerKit.xcresult"
          percent=$(xcrun xccov view --report --json "$xcresult" | python3 -c '
          import json, sys
          report = json.load(sys.stdin)
          print(round(report["lineCoverage"] * 100, 1))
          ')
          {
            echo "## Coverage"
            echo
            echo "Overall line coverage: **${percent}%**"
            echo
            echo '```'
            xcrun xccov view --report "$xcresult"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "percent=${percent}" >> "$GITHUB_OUTPUT"

      - name: Write coverage badge data
        run: |
          set -euo pipefail
          percent="${{ steps.coverage.outputs.percent }}"
          color="red"
          if awk -v p="$percent" 'BEGIN { exit !(p >= 80) }'; then
            color="brightgreen"
          elif awk -v p="$percent" 'BEGIN { exit !(p >= 60) }'; then
            color="yellow"
          fi
          mkdir -p "$RUNNER_TEMP/badge"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$percent" "$color" > "$RUNNER_TEMP/badge/coverage.json"

      # Deliberately *not* `continue-on-error`, unlike the result bundles: the
      # `coverage-badge` job downloads this artifact, so losing it would leave
      # that job to fail further away from the cause.
      - name: Upload coverage badge data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/badge
          retention-days: 14

      - name: Build documentation
        run: >-
          xcodebuild
          -scheme ABPlayerKit-Package
          -destination "$DESTINATION"
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          GCC_TREAT_WARNINGS_AS_ERRORS=YES
          DOCC_WARNINGS_AS_ERRORS=YES
          EXTRACT_APP_INTENTS_METADATA=NO
          docbuild

      - name: Build demo with warnings as errors
        run: >-
          xcodebuild
          -project Examples/ABPlayerKitDemo/ABPlayerKitDemo.xcodeproj
          -scheme ABPlayerKitDemo
          -destination "$DESTINATION"
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          GCC_TREAT_WARNINGS_AS_ERRORS=YES
          EXTRACT_APP_INTENTS_METADATA=NO
          build

  lint:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      # Pinned deliberately. The previous step used whatever `brew install
      # swiftlint` resolved to, so a SwiftLint release that adds or tightens a
      # default rule could turn this job red with no change in this repository.
      # Keep in sync with `.swiftlint-version` — the first step enforces that,
      # and the checksum has to move with the version.
      SWIFTLINT_VERSION: "0.65.0"
      SWIFTLINT_SHA256: "d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6"
    steps:
      - uses: actions/checkout@v4

      - name: Check the pin matches .swiftlint-version
        run: |
          set -euo pipefail
          declared="$(tr -d '[:space:]' < .swiftlint-version)"
          if [ "$declared" != "$SWIFTLINT_VERSION" ]; then
            echo "::error::.swiftlint-version says '${declared}' but this workflow pins '${SWIFTLINT_VERSION}'. Update both, and SWIFTLINT_SHA256 with them."
            exit 1
          fi

      - name: Install pinned SwiftLint
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/swiftlint"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/portable_swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  $dir/portable_swiftlint.zip" | shasum -a 256 -c -
          unzip -qo "$dir/portable_swiftlint.zip" -d "$dir"
          rm "$dir/portable_swiftlint.zip"

      - name: Run SwiftLint
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/swiftlint/swiftlint" version
          "${RUNNER_TEMP}/swiftlint/swiftlint" lint --strict

  thread-sanitizer:
    # Separate job (not a step in build-and-test) so a slow TSan run never
    # delays the main build-and-test result; it runs concurrently instead.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PINNED_DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PREFERRED_SIMULATOR_NAME: iPhone 16 Pro
    steps:
      - uses: actions/checkout@v4

      - name: Resolve toolchain
        run: |
          if test -d "$PINNED_DEVELOPER_DIR"; then
            resolved_developer_dir="$PINNED_DEVELOPER_DIR"
          else
            resolved_developer_dir="$(xcode-select -p)"
          fi
          echo "DEVELOPER_DIR=$resolved_developer_dir" >> "$GITHUB_ENV"

      - name: Prepare iOS simulator
        run: bash .github/scripts/prepare-simulator.sh

      - name: Run core and cache tests under ThreadSanitizer
        run: >-
          xcodebuild
          -scheme ABPlayerKit-Package
          -destination "$DESTINATION"
          -enableThreadSanitizer YES
          -resultBundlePath "$RUNNER_TEMP/ABPlayerKit-TSan.xcresult"
          -only-testing:ABPlayerKitTests
          -only-testing:ABPlayerKitCacheTests
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          GCC_TREAT_WARNINGS_AS_ERRORS=YES
          EXTRACT_APP_INTENTS_METADATA=NO
          test

      # Evidence, not a gate — same reasoning as the build-and-test job's
      # result bundle.
      - name: Upload TSan result bundle
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ABPlayerKit-TSan.xcresult
          path: ${{ runner.temp }}/ABPlayerKit-TSan.xcresult
          retention-days: 14

  coverage-badge:
    name: Publish coverage badge
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download coverage badge data
        uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: badge

      - name: Publish to the badges branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: badge
          publish_branch: badges
          keep_files: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "chore: update coverage badge"
