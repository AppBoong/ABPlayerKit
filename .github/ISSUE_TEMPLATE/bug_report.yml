name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
      description: Minimal steps or a code snippet that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ABPlayerKit version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "iOS 17.5, iPhone 15 Pro, Xcode 16.2"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
